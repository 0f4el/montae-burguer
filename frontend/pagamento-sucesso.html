<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando pagamento | Montaê Burguer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-[#121212] p-5 font-sans text-white">
    <main class="w-full max-w-md rounded-2xl border border-neutral-800 bg-[#1E1E1E] p-7 text-center shadow-2xl">
        <div id="loader" class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-4 border-[#FF9F0D] border-t-transparent"></div>
        <h1 class="text-xl font-black">Confirmando seu pagamento</h1>
        <p id="status" class="mt-3 text-sm text-gray-400">Aguarde um instante. Estamos validando a confirmação da InfinitePay.</p>
        <p id="pedido-id" class="mt-3 hidden text-3xl font-black text-[#FF9F0D]"></p>
        <div id="actions" class="mt-6 hidden gap-3"></div>
    </main>

    <script>
        const STORAGE_KEY = 'montae-pedido-pendente';
        const statusElement = document.getElementById('status');
        const actionsElement = document.getElementById('actions');
        const loader = document.getElementById('loader');
        const pedidoIdElement = document.getElementById('pedido-id');

        function getPendingOrder() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : null;
            } catch {
                return null;
            }
        }

        function salvarPedidoNoHistorico(id) {
            if (!id) return;
            try {
                const historico = JSON.parse(localStorage.getItem('montae-historico-pedidos') || '[]');
                const idNum = Number(id);
                const listaAtualizada = [idNum, ...historico.filter(item => item !== idNum)].slice(0, 15);
                localStorage.setItem('montae-historico-pedidos', JSON.stringify(listaAtualizada));
                localStorage.setItem('montae-ultimo-pedido-id', String(id));
            } catch {
                localStorage.setItem('montae-ultimo-pedido-id', String(id));
            }
        }

        function showAction(label, callback, primary = true) {
            const button = document.createElement('button');
            button.textContent = label;
            button.className = primary
                ? 'flex-1 rounded-xl bg-[#FF9F0D] px-4 py-3 text-xs font-black text-black'
                : 'flex-1 rounded-xl border border-neutral-600 px-4 py-3 text-xs font-bold text-gray-200';
            button.onclick = callback;
            actionsElement.append(button);
            actionsElement.classList.remove('hidden');
            actionsElement.classList.add('flex');
        }

        function mostrarSucesso(pedido) {
            loader.classList.add('hidden');
            statusElement.textContent = 'Pagamento confirmado. O pedido já foi enviado para a hamburgueria.';
            if (pedido?.id) {
                pedidoIdElement.textContent = `#${pedido.id}`;
                pedidoIdElement.classList.remove('hidden');
                salvarPedidoNoHistorico(pedido.id);
            }
            localStorage.removeItem(STORAGE_KEY);
            showAction('Acompanhar pedido', () => {
                window.location.replace(`./?pedido_confirmado=1&pedido_id=${pedido?.id || ''}`);
            });
            showAction('Voltar à loja', () => window.location.replace('./'), false);
        }

        async function confirmPayment() {
            const params = new URLSearchParams(window.location.search);
            const orderNsu = params.get('order_nsu');
            const transactionNsu = params.get('transaction_nsu');
            const slug = params.get('slug') || params.get('invoice_slug');
            const pendingOrder = getPendingOrder();

            if (!orderNsu || !transactionNsu || !slug) {
                loader.classList.add('hidden');
                statusElement.textContent = 'Dados de confirmação não encontrados na URL. Volte à loja para acompanhar seu pedido.';
                if (pendingOrder?.payment?.checkoutUrl) {
                    showAction('Voltar ao pagamento', () => window.location.assign(pendingOrder.payment.checkoutUrl));
                }
                showAction('Voltar à loja', () => window.location.replace('./'), false);
                return;
            }

            try {
                const response = await fetch('/api/verificar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_nsu: orderNsu,
                        transaction_nsu: transactionNsu,
                        slug
                    })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || 'Não foi possível validar o pagamento.');
                }

                const payment = await response.json();
                if (!payment.paid) {
                    loader.classList.add('hidden');
                    statusElement.textContent = 'O pagamento ainda não foi confirmado. Você pode voltar ao checkout e tentar novamente.';
                    if (pendingOrder?.payment?.checkoutUrl) {
                        showAction('Voltar ao pagamento', () => window.location.assign(pendingOrder.payment.checkoutUrl));
                    }
                    showAction('Voltar à loja', () => window.location.replace('./'), false);
                    return;
                }

                mostrarSucesso(payment.pedido);
            } catch (error) {
                loader.classList.add('hidden');
                statusElement.textContent = `${error.message || 'Não conseguimos validar o pagamento agora.'} A hamburgueria também recebe a confirmação automaticamente.`;
                showAction('Tentar novamente', () => {
                    actionsElement.innerHTML = '';
                    actionsElement.classList.add('hidden');
                    loader.classList.remove('hidden');
                    confirmPayment();
                });
                showAction('Voltar à loja', () => window.location.replace('./'), false);
            }
        }

        confirmPayment();
    </script>
</body>
</html>
